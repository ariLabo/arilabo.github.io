name: Deploy Notion Export ZIP

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Group into Title Folders keeping hierarchy, clean hashes, and generate index
        run: |
          python - << 'EOF'
          import os
          import zipfile
          import re
          import shutil

          posts_dir = 'Posts'
          os.makedirs(posts_dir, exist_ok=True)

          # 1. 一時フォルダにZIPを解凍
          temp_dir = 'temp_extracted'
          os.makedirs(temp_dir, exist_ok=True)

          zip_files = [f for f in os.listdir('.') if f.endswith('.zip')]
          for z_file in zip_files:
              print(f"Extracting {z_file}")
              with zipfile.ZipFile(z_file, 'r') as zip_ref:
                  zip_ref.extractall(temp_dir)
              os.remove(z_file)

          # ハッシュ値削除用の正規表現（半角スペース＋32文字の16進数）
          hash_pattern = re.compile(r' [0-9a-f]{32}')

          # 2. 解凍されたすべてのファイルとフォルダの名前からハッシュを削除（深い階層から順に処理）
          for root, dirs, files in os.walk(temp_dir, topdown=False):
              for file in files:
                  if hash_pattern.search(file):
                      old_path = os.path.join(root, file)
                      new_file = hash_pattern.sub('', file)
                      new_path = os.path.join(root, new_file)
                      os.rename(old_path, new_path)
              for d in dirs:
                  if hash_pattern.search(d):
                      old_path = os.path.join(root, d)
                      new_d = hash_pattern.sub('', d)
                      new_path = os.path.join(root, new_d)
                      os.rename(old_path, new_path)

          # 3. HTMLファイル内のテキストに含まれるハッシュもすべて一括置換
          for root, dirs, files in os.walk(temp_dir):
              for file in files:
                  if file.endswith('.html'):
                      file_path = os.path.join(root, file)
                      with open(file_path, 'r', encoding='utf-8') as f:
                          content = f.read()
                      updated_content = hash_pattern.sub('', content)
                      if content != updated_content:
                          with open(file_path, 'w', encoding='utf-8') as f:
                              f.write(updated_content)

          # 4. 各HTMLファイルを検出し、そのタイトルと同じ名前の親フォルダを作って、その中に階層を維持したまままとめる
          for root, dirs, files in os.walk(temp_dir):
              for file in files:
                  if file.endswith('.html'):
                      html_path = os.path.join(root, file)
                      
                      # HTMLの <title> タグからタイトルを取得、なければファイル名を使用
                      title = file.replace('.html', '')
                      try:
                          with open(html_path, 'r', encoding='utf-8') as f:
                              content = f.read()
                              match = re.search(r'<title>(.*?)</title>', content, re.IGNORECASE)
                              if match:
                                  title = match.group(1).strip()
                      except Exception:
                          pass
                      
                      # フォルダ名に使えない文字を安全に置換
                      safe_title = re.sub(r'[\\/*?:"<>|]', '', title).strip()
                      if not safe_title:
                          safe_title = file.replace('.html', '')

                      # 記事ごとの親フォルダパス（Posts/記事タイトル名/）
                      article_parent_dir = os.path.join(posts_dir, safe_title)
                      os.makedirs(article_parent_dir, exist_ok=True)

                      # もし解凍元がすでに同じ親フォルダ内でなければ、このHTMLとそれに紐づくファイル群をタイトルフォルダに移動
                      # (ルート直下などにある場合を考慮)
                      parent_dir_of_html = root
                      if parent_dir_of_html != article_parent_dir:
                          # temp_dir直下にあるアイテムをタイトルフォルダへ移動・統合する
                          for item in os.listdir(temp_dir):
                              src = os.path.join(temp_dir, item)
                              dst = os.path.join(article_parent_dir, item)
                              if os.path.abspath(src) == os.path.abspath(article_parent_dir):
                                  continue
                              if os.path.exists(dst):
                                  if os.path.isdir(dst):
                                      shutil.rmtree(dst)
                                  else:
                                      os.remove(dst)
                              shutil.move(src, dst)
                          break

          # 5. 一時フォルダの削除
          if os.path.exists(temp_dir):
              shutil.rmtree(temp_dir)

          # 6. リポジトリ全体のHTMLファイルをスキャンして index.html を自動生成
          html_files = []
          for root, dirs, files in os.walk('.'):
              if '.github' in root:
                  continue
              for file in files:
                  if file.endswith('.html') and file != 'index.html':
                      rel_path = os.path.relpath(os.path.join(root, file), '.')
                      rel_path = rel_path.replace('\\', '/')
                      
                      title = file.replace('.html', '')
                      try:
                          with open(os.path.join(root, file), 'r', encoding='utf-8') as f:
                              content = f.read()
                              match = re.search(r'<title>(.*?)</title>', content, re.IGNORECASE)
                              if match:
                                  title = match.group(1)
                      except Exception:
                          pass
                      html_files.append((rel_path, title))

          # 7. index.html の生成
          index_content = """<!DOCTYPE html>
          <html lang="ja">
          <head>
              <meta charset="UTF-8">
              <title>Chamonchiのブログ / ログ一覧</title>
              <style>
                  body { font-family: sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; line-height: 1.6; background-color: #f9f9f9; color: #333; }
                  h1 { border-bottom: 2px solid #ddd; padding-bottom: 10px; }
                  ul { padding-left: 20px; }
                  li { margin: 12px 0; }
                  a { color: #0066cc; text-decoration: none; font-weight: bold; }
                  a:hover { text-decoration: underline; }
                  .path { font-size: 0.85em; color: #666; margin-left: 8px; }
              </style>
          </head>
          <body>
              <h1>📚 教学・Pythonログ一覧</h1>
              <ul>
          """

          for path, title in sorted(html_files, reverse=True):
              index_content += f'        <li><a href="{path}">{title}</a><span class="path">({path})</span></li>\n'

          index_content += """    </ul>
          </body>
          </html>
          """

          with open('index.html', 'w', encoding='utf-8') as f:
              f.write(index_content)
          print("Successfully grouped into title folders with exact hierarchy and generated index.html!")
          EOF

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --staged --quiet || git commit -m "Group into title folders keeping hierarchy, remove hashes, and update index.html"
          git push
