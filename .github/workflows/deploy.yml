name: Deploy Notion Export ZIP

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Organize into Title Folders, Rename, and Generate Index
        run: |
          python - << 'EOF'
          import os
          import zipfile
          import re
          import shutil

          posts_dir = 'Posts'
          os.makedirs(posts_dir, exist_ok=True)

          # 1. 一時的な解凍用フォルダを作成してZIPを解凍
          temp_dir = 'temp_extracted'
          os.makedirs(temp_dir, exist_ok=True)

          zip_files = [f for f in os.listdir('.') if f.endswith('.zip')]
          for z_file in zip_files:
              print(f"Extracting {z_file}")
              with zipfile.ZipFile(z_file, 'r') as zip_ref:
                  zip_ref.extractall(temp_dir)
              os.remove(z_file)

          # ハッシュ値削除用の正規表現（半角スペース＋32文字）
          hash_pattern = re.compile(r' [0-9a-f]{32}')

          # 2. 解凍されたファイル郡をスキャンして、記事ごとにタイトル名フォルダへ仕分け＆リネーム
          for root, dirs, files in os.walk(temp_dir):
              for file in files:
                  if file.endswith('.html'):
                      old_html_path = os.path.join(root, file)
                      
                      # HTML内の <title> タグからタイトルを取得、なければファイル名からハッシュを除いたものを使用
                      title = file.replace('.html', '')
                      try:
                          with open(old_html_path, 'r', encoding='utf-8') as f:
                              content = f.read()
                              match = re.search(r'<title>(.*?)</title>', content, re.IGNORECASE)
                              if match:
                                  title = match.group(1).strip()
                      except Exception:
                          pass
                      
                      # フォルダ名に使えない文字（ファイルシステムで禁止されている文字）を安全な文字に置換
                      safe_title = re.sub(r'[\\/*?:"<>|]', '', title)
                      # ハッシュも念のため除去
                      safe_title = hash_pattern.sub('', safe_title).strip()

                      # 新しい記事専用フォルダのパス（Posts/記事タイトル/）
                      article_dir = os.path.join(posts_dir, safe_title)
                      os.makedirs(article_dir, exist_ok=True)

                      # HTMLファイル自体の新しいパス（ハッシュを削除したファイル名）
                      new_file_name = hash_pattern.sub('', file)
                      new_html_path = os.path.join(article_dir, new_file_name)

                      # HTMLファイル内のハッシュ削除とリンク置換
                      with open(old_html_path, 'r', encoding='utf-8') as f:
                          html_content = f.read()
                      html_content = hash_pattern.sub('', html_content)
                      
                      with open(new_html_path, 'w', encoding='utf-8') as f:
                          f.write(html_content)

                      # もし同じ名前の「_files」フォルダ（画像等）があれば、それも一緒に記事タイトルフォルダへ移動
                      base_name_without_ext = file.replace('.html', '')
                      possible_assets_dir = os.path.join(root, base_name_without_ext + '_files')
                      if os.path.exists(possible_assets_dir):
                          new_assets_name = hash_pattern.sub('', base_name_without_ext) + '_files'
                          target_assets_dir = os.path.join(article_dir, new_assets_name)
                          if os.path.exists(target_assets_dir):
                              shutil.rmtree(target_assets_dir)
                          shutil.move(possible_assets_dir, target_assets_dir)
                          print(f"Moved assets to: {target_assets_dir}")

          # 3. 一時フォルダを削除
          if os.path.exists(temp_dir):
              shutil.rmtree(temp_dir)

          # 4. リポジトリ全体のHTMLファイルをスキャンして index.html を生成
          html_files = []
          for root, dirs, files in os.walk('.'):
              if '.github' in root or 'temp_extracted' in root:
                  continue
              for file in files:
                  if file.endswith('.html') and file != 'index.html':
                      rel_path = os.path.relpath(os.path.join(root, file), '.')
                      rel_path = rel_path.replace('\\', '/')
                      
                      title = file.replace('.html', '')
                      try:
                          with open(os.path.join(root, file), 'r', encoding='utf-8') as f:
                              content = f.read()
                              match = re.search(r'<title>(.*?)</title>', content, re.IGNORECASE)
                              if match:
                                  title = match.group(1)
                      except Exception:
                          pass
                      html_files.append((rel_path, title))

          # 5. index.html の自動生成
          index_content = """<!DOCTYPE html>
          <html lang="ja">
          <head>
              <meta charset="UTF-8">
              <title>Chamonchiのブログ / ログ一覧</title>
              <style>
                  body { font-family: sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; line-height: 1.6; background-color: #f9f9f9; color: #333; }
                  h1 { border-bottom: 2px solid #ddd; padding-bottom: 10px; }
                  ul { padding-left: 20px; }
                  li { margin: 12px 0; }
                  a { color: #0066cc; text-decoration: none; font-weight: bold; }
                  a:hover { text-decoration: underline; }
                  .path { font-size: 0.85em; color: #666; margin-left: 8px; }
              </style>
          </head>
          <body>
              <h1>📚 教学・Pythonログ一覧</h1>
              <ul>
          """

          for path, title in sorted(html_files, reverse=True):
              index_content += f'        <li><a href="{path}">{title}</a><span class="path">({path})</span></li>\n'

          index_content += """    </ul>
          </body>
          </html>
          """

          with open('index.html', 'w', encoding='utf-8') as f:
              f.write(index_content)
          print("Successfully organized into title folders and generated index.html!")
          EOF

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --staged --quiet || git commit -m "Organize articles into title folders, remove hashes, and update index.html"
          git push
