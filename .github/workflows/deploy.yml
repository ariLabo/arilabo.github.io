name: Deploy Notion Export ZIP

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Process ZIP cleanly and generate index
        run: |
          python - << 'EOF'
          import os
          import zipfile
          import re
          import shutil

          posts_dir = 'Posts'
          os.makedirs(posts_dir, exist_ok=True)

          # 1. 一時フォルダにZIPを解凍
          temp_dir = 'temp_extracted'
          os.makedirs(temp_dir, exist_ok=True)

          zip_files = [f for f in os.listdir('.') if f.endswith('.zip')]
          for z_file in zip_files:
              print(f"Extracting {z_file}")
              with zipfile.ZipFile(z_file, 'r') as zip_ref:
                  zip_ref.extractall(temp_dir)
              os.remove(z_file)

          # ハッシュ値削除用の正規表現（半角スペース＋32文字の16進数）
          hash_pattern = re.compile(r' [0-9a-f]{32}')

          # 2. 解凍されたすべてのファイルとフォルダの名前からハッシュを削除
          for root, dirs, files in os.walk(temp_dir, topdown=False):
              for file in files:
                  if hash_pattern.search(file):
                      old_path = os.path.join(root, file)
                      new_file = hash_pattern.sub('', file)
                      new_path = os.path.join(root, new_file)
                      os.rename(old_path, new_path)
              for d in dirs:
                  if hash_pattern.search(d):
                      old_path = os.path.join(root, d)
                      new_d = hash_pattern.sub('', d)
                      new_path = os.path.join(root, new_d)
                      os.rename(old_path, new_path)

          # 3. HTMLファイル内のテキストに含まれるハッシュも一括置換
          for root, dirs, files in os.walk(temp_dir):
              for file in files:
                  if file.endswith('.html'):
                      file_path = os.path.join(root, file)
                      with open(file_path, 'r', encoding='utf-8') as f:
                          content = f.read()
                      updated_content = hash_pattern.sub('', content)
                      if content != updated_content:
                        with open(file_path, 'w', encoding='utf-8') as f:
                            f.write(updated_content)

          # 4. ZIP内にある各HTMLファイルを独立した記事フォルダとして整理して Posts/ へ配置
          # (二重フォルダを防ぎ、 "Posts/記事タイトル/記事.html" という綺麗な構造にする)
          for root, dirs, files in os.walk(temp_dir):
              for file in files:
                  if file.endswith('.html'):
                      src_html_path = os.path.join(root, file)
                      
                      # タイトル抽出
                      title = file.replace('.html', '')
                      try:
                          with open(src_html_path, 'r', encoding='utf-8') as f:
                              content = f.read()
                              match = re.search(r'<title>(.*?)</title>', content, re.IGNORECASE)
                              if match:
                                  title = match.group(1).strip()
                      except Exception:
                          pass
                      
                      safe_title = re.sub(r'[\\/*?:"<>|]', '', title).strip()
                      if not safe_title:
                          safe_title = file.replace('.html', '')

                      # 記事専用の親フォルダ（Posts/記事タイトル/）
                      article_dir = os.path.join(posts_dir, safe_title)
                      os.makedirs(article_dir, exist_ok=True)

                      # HTMLを記事フォルダ内に移動
                      dest_html_path = os.path.join(article_dir, file)
                      if os.path.abspath(src_html_path) != os.path.abspath(dest_html_path):
                          if os.path.exists(dest_html_path):
                              os.remove(dest_html_path)
                          shutil.move(src_html_path, dest_html_path)

                      # 対応する _files フォルダがあればそれも記事フォルダ内に移動
                      base_name = file.replace('.html', '')
                      assets_folder_name = base_name + '_files'
                      src_assets_path = os.path.join(root, assets_folder_name)
                      if os.path.exists(src_assets_path):
                          dest_assets_path = os.path.join(article_dir, assets_folder_name)
                          if os.path.exists(dest_assets_path):
                              shutil.rmtree(dest_assets_path)
                          shutil.move(src_assets_path, dest_assets_path)

          # 5. 一時フォルダの削除
          if os.path.exists(temp_dir):
              shutil.rmtree(temp_dir)

          # 6. リポジトリ全体のHTMLファイルをスキャンして index.html を自動生成
          html_files = []
          for root, dirs, files in os.walk('.'):
              if '.github' in root:
                  continue
              for file in files:
                  if file.endswith('.html') and file != 'index.html':
                      rel_path = os.path.relpath(os.path.join(root, file), '.')
                      rel_path = rel_path.replace('\\', '/')
                      
                      title = file.replace('.html', '')
                      try:
                          with open(os.path.join(root, file), 'r', encoding='utf-8') as f:
                              content = f.read()
                              match = re.search(r'<title>(.*?)</title>', content, re.IGNORECASE)
                              if match:
                                  title = match.group(1)
                      except Exception:
                          pass
                      html_files.append((rel_path, title))

          # 7. index.html の生成
          index_content = """<!DOCTYPE html>
          <html lang="ja">
          <head>
              <meta charset="UTF-8">
              <title>Chamonchiのブログ / ログ一覧</title>
              <style>
                  body { font-family: sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; line-height: 1.6; background-color: #f9f9f9; color: #333; }
                  h1 { border-bottom: 2px solid #ddd; padding-bottom: 10px; }
                  ul { padding-left: 20px; }
                  li { margin: 12px 0; }
                  a { color: #0066cc; text-decoration: none; font-weight: bold; }
                  a:hover { text-decoration: underline; }
                  .path { font-size: 0.85em; color: #666; margin-left: 8px; }
              </style>
          </head>
          <body>
              <h1>📚 教学・Pythonログ一覧</h1>
              <ul>
          """

          for path, title in sorted(html_files, reverse=True):
              index_content += f'        <li><a href="{path}">{title}</a><span class="path">({path})</span></li>\n'

          index_content += """    </ul>
          </body>
          </html>
          """

          with open('index.html', 'w', encoding='utf-8') as f:
              f.write(index_content)
          print("Successfully organized into proper title folders and generated index.html!")
          EOF

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --staged --quiet || git commit -m "Fix folder nesting, remove hashes, and update index.html"
          git push

