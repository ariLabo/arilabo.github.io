name: Deploy Notion Export ZIP

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Extract ZIP keeping structure, Rename, and Generate Index
        run: |
          python - << 'EOF'
          import os
          import zipfile
          import re
          import shutil

          posts_dir = 'Posts'
          os.makedirs(posts_dir, exist_ok=True)

          # 1. 一時的な解凍用フォルダを作成してZIPを解凍
          temp_dir = 'temp_extracted'
          os.makedirs(temp_dir, exist_ok=True)

          zip_files = [f for f in os.listdir('.') if f.endswith('.zip')]
          for z_file in zip_files:
              print(f"Extracting {z_file}")
              with zipfile.ZipFile(z_file, 'r') as zip_ref:
                  zip_ref.extractall(temp_dir)
              os.remove(z_file)

          # ハッシュ値削除用の正規表現（半角スペース＋32文字の16進数）
          hash_pattern = re.compile(r' [0-9a-f]{32}')

          # 2. 一時フォルダ内のすべてのファイル・フォルダ名をリネーム（ハッシュ削除）
          # 階層の深いところから処理するために topdown=False にする
          for root, dirs, files in os.walk(temp_dir, topdown=False):
              for file in files:
                  if hash_pattern.search(file):
                      old_p = os.path.join(root, file)
                      new_f = hash_pattern.sub('', file)
                      new_p = os.path.join(root, new_f)
                      os.rename(old_p, new_p)
              for d in dirs:
                  if hash_pattern.search(d):
                      old_p = os.path.join(root, d)
                      new_d = hash_pattern.sub('', d)
                      new_p = os.path.join(root, new_d)
                      os.rename(old_p, new_p)

          # 3. リネーム後のHTMLファイル内のリンクや画像パスもハッシュ削除に合わせて書き換え
          for root, dirs, files in os.walk(temp_dir):
              for file in files:
                  if file.endswith('.html'):
                      f_path = os.path.join(root, file)
                      with open(f_path, 'r', encoding='utf-8') as f:
                          content = f.read()
                      updated = hash_pattern.sub('', content)
                      if content != updated:
                          with open(f_path, 'w', encoding='utf-8') as f:
                              f.write(updated)

          # 4. 階層構造（ツリー）をそのまま Posts/ の中へ丸ごと移動
          # temp_dir 直下にあるもの（フォルダやファイル）を Posts/ の中に移す
          for item in os.listdir(temp_dir):
              src_item = os.path.join(temp_dir, item)
              dst_item = os.path.join(posts_dir, item)
              
              # すでにPosts内に同名ファイル/フォルダがある場合は一度削除して上書き
              if os.path.exists(dst_item):
                  if os.path.isdir(dst_item):
                      shutil.rmtree(dst_item)
                  else:
                      os.remove(dst_item)
              
              shutil.move(src_item, dst_item)

          # 5. 一時フォルダを削除
          if os.path.exists(temp_dir):
              shutil.rmtree(temp_dir)

          # 6. リポジトリ全体のHTMLファイルをスキャンして index.html を生成
          html_files = []
          for root, dirs, files in os.walk('.'):
              if '.github' in root:
                  continue
              for file in files:
                  if file.endswith('.html') and file != 'index.html':
                      rel_path = os.path.relpath(os.path.join(root, file), '.')
                      rel_path = rel_path.replace('\\', '/')
                      
                      # タイトル抽出
                      title = file.replace('.html', '')
                      try:
                          with open(os.path.join(root, file), 'r', encoding='utf-8') as f:
                              content = f.read()
                              match = re.search(r'<title>(.*?)</title>', content, re.IGNORECASE)
                              if match:
                                  title = match.group(1)
                      except Exception:
                          pass
                      html_files.append((rel_path, title))

          # 7. index.html の自動生成
          index_content = """<!DOCTYPE html>
          <html lang="ja">
          <head>
              <meta charset="UTF-8">
              <title>Chamonchiのブログ / ログ一覧</title>
              <style>
                  body { font-family: sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; line-height: 1.6; background-color: #f9f9f9; color: #333; }
                  h1 { border-bottom: 2px solid #ddd; padding-bottom: 10px; }
                  ul { padding-left: 20px; }
                  li { margin: 12px 0; }
                  a { color: #0066cc; text-decoration: none; font-weight: bold; }
                  a:hover { text-decoration: underline; }
                  .path { font-size: 0.85em; color: #666; margin-left: 8px; }
              </style>
          </head>
          <body>
              <h1>📚 教学・Pythonログ一覧</h1>
              <ul>
          """

          for path, title in sorted(html_files, reverse=True):
              index_content += f'        <li><a href="{path}">{title}</a><span class="path">({path})</span></li>\n'

          index_content += """    </ul>
          </body>
          </html>
          """

          with open('index.html', 'w', encoding='utf-8') as f:
              f.write(index_content)
          print("Successfully extracted keeping original hierarchy and generated index.html!")
          EOF

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --staged --quiet || git commit -m "Keep ZIP hierarchy in Posts, remove hashes, and update index.html"
          git push
