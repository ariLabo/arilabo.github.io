name: Deploy Notion Export ZIP

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Pre-check existing links, extract ZIP, clean hashes, and update
        run: |
          python - << 'EOF'
          import os
          import zipfile
          import re
          import shutil
          from datetime import datetime

          posts_dir = 'Posts'
          os.makedirs(posts_dir, exist_ok=True)

          hash_pattern = re.compile(r' [0-9a-f]{32}')

          # 1. 【ZIP解凍前】既存のHTMLファイル（index.htmlや既存の投稿など）をスキャンし、
          #    存在しないファイルへのリンクがあれば、リンクを解除して打ち消し線（<del>）にする
          for root, dirs, files in os.walk('.'):
              if '.github' in root or 'temp_extracted' in root:
                  continue
              for file in files:
                  if file.endswith('.html'):
                      file_path = os.path.join(root, file)
                      with open(file_path, 'r', encoding='utf-8') as f:
                          content = f.read()

                      def check_link_existence(match):
                          full_tag = match.group(0)
                          href_val = match.group(1)
                          link_text = match.group(2)

                          # 外部URLやページ内リンクは除外
                          if href_val.startswith('http://') or href_val.startswith('https://') or href_val.startswith('#'):
                              return full_tag

                          # ハッシュが含まれている場合はあらかじめハッシュを取ったパスで存在確認する
                          clean_href = hash_pattern.sub('', href_val)

                          # 現在のHTMLファイルの位置から見たリンク先のパスを計算
                          target_path = os.path.normpath(os.path.join(root, clean_href))

                          # ファイルが存在するか確認
                          if not os.path.exists(target_path):
                              # 存在しない場合はリンクを解除して打ち消し線にする
                              return f'<del style="color: #888;" title="リンク先が存在しません">{link_text}</del>'
                          
                          return full_tag

                      # <a href="...">...</a> をすべてチェック
                      updated_content = re.sub(r'<a\s+[^>]*href="([^"]+?)"[^>]*>(.*?)</a>', check_link_existence, content, flags=re.DOTALL)

                      if content != updated_content:
                          with open(file_path, 'w', encoding='utf-8') as f:
                              f.write(updated_content)

          # 2. 一時フォルダにZIPを解凍
          temp_dir = 'temp_extracted'
          os.makedirs(temp_dir, exist_ok=True)

          zip_files = [f for f in os.listdir('.') if f.endswith('.zip')]
          for z_file in zip_files:
              print(f"Extracting {z_file}")
              with zipfile.ZipFile(z_file, 'r') as zip_ref:
                  zip_ref.extractall(temp_dir)
              os.remove(z_file)

          # 3. 解凍されたすべてのファイルとフォルダの名前からハッシュを削除
          for root, dirs, files in os.walk(temp_dir, topdown=False):
              for file in files:
                  if hash_pattern.search(file):
                      old_path = os.path.join(root, file)
                      new_file = hash_pattern.sub('', file)
                      new_path = os.path.join(root, new_file)
                      os.rename(old_path, new_path)
              for d in dirs:
                  if hash_pattern.search(d):
                      old_path = os.path.join(root, d)
                      new_d = hash_pattern.sub('', d)
                      new_path = os.path.join(root, new_d)
                      os.rename(old_path, new_path)

          # 4. 解凍されたHTMLファイル内の href 内のハッシュも置換
          for root, dirs, files in os.walk(temp_dir):
              for file in files:
                  if file.endswith('.html'):
                      file_path = os.path.join(root, file)
                      with open(file_path, 'r', encoding='utf-8') as f:
                          content = f.read()

                      def remove_hash_from_href(match):
                          inner = match.group(1)
                          cleaned = hash_pattern.sub('', inner)
                          return f'href="{cleaned}"'

                      updated_content = re.sub(r'href="([^"]+?)"', remove_hash_from_href, content)
                      updated_content = hash_pattern.sub('', updated_content)

                      if content != updated_content:
                          with open(file_path, 'w', encoding='utf-8') as f:
                              f.write(updated_content)

          # 5. 日付フォルダ（YYYYMMDD形式）のフォルダを Posts/ の中に作成し、ZIPの中身を移動
          today_str = datetime.now().strftime('%Y%m%d')
          target_date_dir = os.path.join(posts_dir, today_str)
          os.makedirs(target_date_dir, exist_ok=True)

          for item in os.listdir(temp_dir):
              src_item = os.path.join(temp_dir, item)
              dst_item = os.path.join(target_date_dir, item)
              
              if os.path.exists(dst_item):
                  if os.path.isdir(dst_item):
                      shutil.rmtree(dst_item)
                  else:
                      os.remove(dst_item)
              
              shutil.move(src_item, dst_item)

          # 6. 一時フォルダの削除
          if os.path.exists(temp_dir):
              shutil.rmtree(temp_dir)

          # 7. リポジトリ全体のHTMLファイルをスキャンして index.html を自動生成
          html_files = []
          for root, dirs, files in os.walk('.'):
              if '.github' in root or 'temp_extracted' in root:
                  continue
              for file in files:
                  if file.endswith('.html') and file != 'index.html':
                      rel_path = os.path.relpath(os.path.join(root, file), '.')
                      rel_path = rel_path.replace('\\', '/')
                      
                      title = file.replace('.html', '')
                      try:
                          with open(os.path.join(root, file), 'r', encoding='utf-8') as f:
                              content = f.read()
                              match = re.search(r'<title>(.*?)</title>', content, re.IGNORECASE)
                              if match:
                                  title = match.group(1)
                      except Exception:
                          pass
                      html_files.append((rel_path, title))

          # 8. index.html の生成
          index_content = """<!DOCTYPE html>
          <html lang="ja">
          <head>
              <meta charset="UTF-8">
              <title>Chamonchiのブログ / ログ一覧</title>
              <style>
                  body { font-family: sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; line-height: 1.6; background-color: #f9f9f9; color: #333; }
                  h1 { border-bottom: 2px solid #ddd; padding-bottom: 10px; }
                  ul { padding-left: 20px; }
                  li { margin: 12px 0; }
                  a { color: #0066cc; text-decoration: none; font-weight: bold; }
                  a:hover { text-decoration: underline; }
                  .path { font-size: 0.85em; color: #666; margin-left: 8px; }
              </style>
          </head>
          <body>
              <h1>📚 教学・Pythonログ一覧</h1>
              <ul>
          """

          for path, title in sorted(html_files, reverse=True):
              index_content += f'        <li><a href="{path}">{title}</a><span class="path">({path})</span></li>\n'

          index_content += """    </ul>
          </body>
          </html>
          """

          with open('index.html', 'w', encoding='utf-8') as f:
              f.write(index_content)
          print("Successfully checked existing links before unzip, extracted, and updated index.html!")
          EOF

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --staged --quiet || git commit -m "Pre-check broken links, convert to strikethrough, extract ZIP, and update index"
          git push
