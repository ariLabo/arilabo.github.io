name: Deploy Notion Export & Sync

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Clean hashes, check links, embed media from lists, and update
        run: |
          python - << 'EOF'
          import os
          import zipfile
          import re
          import shutil
          from datetime import datetime

          posts_dir = 'Posts'
          os.makedirs(posts_dir, exist_ok=True)

          hash_pattern = re.compile(r'(?:%20|\s+)[0-9a-f]{32}', re.IGNORECASE)

          # ==========================================
          # 📋 [設定] 埋め込みに自動変換したいルールリスト
          # ==========================================
          # ここに条件やキーワードを追加・変更することで、いつでも自由に変更できます。
          EMBED_RULES = [
              {
                  "name": "YouTube",
                  "patterns": [r'(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/ ]{11})'],
                  "template": lambda match: f'''
                      <div style="position: relative; width: 100%; height: 0; padding-bottom: 56.25%; margin: 20px 0;">
                          <iframe src="https://www.youtube.com/embed/{match.group(1)}" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0;" allowfullscreen></iframe>
                      </div>
                      '''
              },
              {
                  "name": "Google Maps",
                  "patterns": [r'google\.com\/maps', r'goo\.gl\/maps', r'maps\.app\.goo\.gl'],
                  "template": lambda match, href: f'''
                      <div style="width: 100%; height: 400px; margin: 20px 0;">
                          <iframe src="{href}" width="100%" height="100%" style="border:0;" allowfullscreen="" loading="lazy"></iframe>
                      </div>
                      '''
              }
              # 💡 【追加したい場合】ここに新しいルールの辞書を増やしていくことができます
              # {
              #     "name": "Twitter / X",
              #     "patterns": [r'twitter\.com\/.*\/status', r'x\.com\/.*\/status'],
              #     "template": lambda match, href: ...
              # }
          ]
          # ==========================================

          # 0. 既存ファイル名のセットを収集
          all_existing_htmls = set()
          for root, dirs, files in os.walk('.'):
              if '.github' in root or 'temp_extracted' in root:
                  continue
              for file in files:
                  if file.endswith('.html'):
                      all_existing_htmls.add(file)

          # 1. 既存のHTMLファイルをスキャン
          for root, dirs, files in os.walk('.'):
              if '.github' in root or 'temp_extracted' in root:
                  continue
              for file in files:
                  if file.endswith('.html'):
                      file_path = os.path.join(root, file)
                      with open(file_path, 'r', encoding='utf-8') as f:
                          content = f.read()

                      content = hash_pattern.sub('', content)

                      link_pattern = re.compile(r'<a\s+([^>]*?)href="([^"]+?)"([^>]*?)>(.*?)</a>', re.DOTALL | re.IGNORECASE)

                      def process_link(match):
                          prefix_attrs = match.group(1)
                          href_val = match.group(2)
                          suffix_attrs = match.group(3)
                          inner_html = match.group(4)

                          if href_val.startswith('#'):
                              return match.group(0)

                          clean_href = hash_pattern.sub('', href_val)

                          # リスト（EMBED_RULES）を上から順にチェックし、マッチしたら埋め込みに変換
                          for rule in EMBED_RULES:
                              for pat in rule["patterns"]:
                                  m = re.search(pat, clean_href)
                                  if m:
                                      # テンプレートの種類に合わせて呼び出しを切り分け
                                      if rule["name"] == "YouTube":
                                          return rule["template"](m)
                                      else:
                                          return rule["template"](m, clean_href)

                          # 通常の内部・外部リンクの存在チェック
                          if clean_href.startswith('http://') or clean_href.startswith('https://'):
                              return match.group(0)

                          target_filename = os.path.basename(clean_href)
                          if target_filename not in all_existing_htmls:
                              return inner_html
                          
                          return f'<a {prefix_attrs}href="{clean_href}"{suffix_attrs}>{inner_html}</a>'

                      updated_content = link_pattern.sub(process_link, content)

                      if content != updated_content:
                          with open(file_path, 'w', encoding='utf-8') as f:
                              f.write(updated_content)

          # 2. 一時フォルダにZIPを解凍（ZIPがある場合のみ）
          temp_dir = 'temp_extracted'
          zip_files = [f for f in os.listdir('.') if f.endswith('.zip')]

          if zip_files:
              os.makedirs(temp_dir, exist_ok=True)
              for z_file in zip_files:
                  print(f"Extracting {z_file}")
                  with zipfile.ZipFile(z_file, 'r') as zip_ref:
                      zip_ref.extractall(temp_dir)
                  os.remove(z_file)

              for root, dirs, files in os.walk(temp_dir, topdown=False):
                  for file in files:
                      if hash_pattern.search(file):
                          old_path = os.path.join(root, file)
                          new_file = hash_pattern.sub('', file)
                          new_path = os.path.join(root, new_file)
                          os.rename(old_path, new_path)
                  for d in dirs:
                      if hash_pattern.search(d):
                          old_path = os.path.join(root, d)
                          new_d = hash_pattern.sub('', d)
                          new_path = os.path.join(root, new_d)
                          os.rename(old_path, new_path)

              for root, dirs, files in os.walk(temp_dir):
                  for file in files:
                      if file.endswith('.html'):
                          file_path = os.path.join(root, file)
                          with open(file_path, 'r', encoding='utf-8') as f:
                              content = f.read()
                          updated_content = hash_pattern.sub('', content)
                          if content != updated_content:
                              with open(file_path, 'w', encoding='utf-8') as f:
                                  f.write(updated_content)

              today_str = datetime.now().strftime('%Y%m%d')
              target_date_dir = os.path.join(posts_dir, today_str)
              os.makedirs(target_date_dir, exist_ok=True)

              for item in os.listdir(temp_dir):
                  src_item = os.path.join(temp_dir, item)
                  dst_item = os.path.join(target_date_dir, item)
                  if os.path.exists(dst_item):
                      if os.path.isdir(dst_item):
                          shutil.rmtree(dst_item)
                      else:
                          os.remove(dst_item)
                  shutil.move(src_item, dst_item)

              if os.path.exists(temp_dir):
                  shutil.rmtree(temp_dir)
          else:
              print("No ZIP file found. Skipping extraction (Manual sync mode).")

          # 7. index.html の生成
          html_files = []
          for root, dirs, files in os.walk('.'):
              if '.github' in root or 'temp_extracted' in root:
                  continue
              for file in files:
                  if file.endswith('.html') and file != 'index.html':
                      rel_path = os.path.relpath(os.path.join(root, file), '.')
                      rel_path = rel_path.replace('\\', '/')
                      title = file.replace('.html', '')
                      try:
                          with open(os.path.join(root, file), 'r', encoding='utf-8') as f:
                              content = f.read()
                              match = re.search(r'<title>(.*?)</title>', content, re.IGNORECASE)
                              if match:
                                  title = match.group(1)
                      except Exception:
                          pass
                      html_files.append((rel_path, title))

          index_content = """<!DOCTYPE html>
          <html lang="ja">
          <head>
              <meta charset="UTF-8">
              <title>Chamonchiのブログ / ログ一覧</title>
              <style>
                  body { font-family: sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; line-height: 1.6; background-color: #f9f9f9; color: #333; }
                  h1 { border-bottom: 2px solid #ddd; padding-bottom: 10px; }
                  ul { padding-left: 20px; }
                  li { margin: 12px 0; }
                  a { color: #0066cc; text-decoration: none; font-weight: bold; }
                  a:hover { text-decoration: underline; }
                  .path { font-size: 0.85em; color: #666; margin-left: 8px; }
              </style>
          </head>
          <body>
              <h1>📚 教学・Pythonログ一覧</h1>
              <ul>
          """

          for path, title in sorted(html_files, reverse=True):
              index_content += f'        <li><a href="{path}">{title}</a><span class="path">({path})</span></li>\n'

          index_content += """    </ul>
          </body>
          </html>
          """

          with open('index.html', 'w', encoding='utf-8') as f:
              f.write(index_content)
          print("Successfully synced and updated index.html with modular embed rules!")
          EOF
