            <div class="page-body"><p class="" dir="auto" id="b6c6867a-b656-4778-8fa1-a41ba87bbdf4">2026.8.18（火）晴れ　休み</p><p class="" dir="auto" id="8af09f56-b568-45fa-a663-4e6248269a11">ぼーとしていると何もはじまらないので、フィールドノートに書いて、HPにアップしてみる。</p><p class="" dir="auto" id="fa0b62fe-4053-4ebc-893d-95b4c180f184">もうあと5日ぐらいで2学期がはじまる。まだすべて終わってないし、予定していた授業準備もできていない。</p><p class="" dir="auto" id="ee8da597-fa83-4d58-97f1-9486ba009ed4">毎日、授業の準備ができない1学期だった。その反省を生かして2学期の戦略にはまず</p><p class="" dir="auto" id="0cab4ad9-fbbd-4cad-8b23-4cdef666ab6a">SRTは、算数のノートに、授業で子どもにとらせる内容を書き込んで、HPにアップする。</p><p class="" dir="auto" id="f6174990-2739-43e4-b3a3-2206cd1e6e84">このフィールドノートと同じようにアップしていこう！</p><p class="" dir="auto" id="d1621e47-c508-40c6-b6a8-c87bfd59b0d4">Let's try!</p><hr dir="auto" id="066d3cf3-8842-4448-a0f9-4ed5ba0d5aba"/><figure class="image" data-notion-image="%E3%83%95%E3%82%A3%E3%83%BC%E3%83%AB%E3%83%89%E3%83%8E%E3%83%BC%E3%83%88/nse-9024935380833535802-11217.jpg" dir="ltr" id="3c0848aa-641e-814b-ab33-ca775227ab75"><a href="%E3%83%95%E3%82%A3%E3%83%BC%E3%83%AB%E3%83%89%E3%83%8E%E3%83%BC%E3%83%88/nse-9024935380833535802-11217.jpg"><img src="%E3%83%95%E3%82%A3%E3%83%BC%E3%83%AB%E3%83%89%E3%83%8E%E3%83%BC%E3%83%88/nse-9024935380833535802-11217.jpg"/></a></figure></div>
